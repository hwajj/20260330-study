services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: si
      MYSQL_USER: si
      MYSQL_PASSWORD: si
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: si
      MYSQL_USER: si
      MYSQL_PASSWORD: si
      SPRING_PROFILES_ACTIVE: mysql
    depends_on:
      db:
        condition: service_healthy
