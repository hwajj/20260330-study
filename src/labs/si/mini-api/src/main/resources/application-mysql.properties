spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:si}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:si}
spring.datasource.password=${MYSQL_PASSWORD:si}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
